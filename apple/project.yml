# XcodeGen spec. Generate with: cd apple && xcodegen generate   (VectorCraft.xcodeproj is gitignored)
name: VectorCraft
options:
  bundleIdPrefix: ca.hologram
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "$(VECTORCRAFT_MARKETING_VERSION)"
    VECTORCRAFT_MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
packages:
  VectorCraftKit:
    path: VectorCraftKit
targets:
  VectorCraft:
    type: application
    platform: iOS
    sources:
      - path: VectorCraft
        excludes:
          - "**/.DS_Store"
          - "**/*.entitlements"
    dependencies:
      - package: VectorCraftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.vectorcraft
        CODE_SIGN_ENTITLEMENTS: VectorCraft/VectorCraft.entitlements
        PRODUCT_NAME: VectorCraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Check VectorCraftBridge.xcframework
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -d "${SRCROOT}/VectorCraftKit/VectorCraftBridge.xcframework" ] || [ ! -f "${SRCROOT}/VectorCraftKit/Sources/VectorCraftKit/vectorcraft_apple.swift" ]; then
            echo "error: VectorCraftBridge.xcframework (or generated vectorcraft_apple.swift) is missing: run apple/scripts/build-xcframework.sh"
            exit 1
          fi
    info:
      path: build/Info/VectorCraft-Info.plist
      properties:
        CFBundleDisplayName: VectorCraft
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIImageRespectsSafeAreaInsets: false
        UIFileSharingEnabled: true
        NSUbiquitousContainers:
          iCloud.ca.hologram.vectorcraft:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: VectorCraft
            NSUbiquitousContainerSupportedFolderLevels: Any
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: VectorCraft Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [ca.hologram.vectorcraft.document]
          - CFBundleTypeName: DrawCraft Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [ca.hologram.vectorcraft.legacy]
          - CFBundleTypeName: SVG Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.svg-image]
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Illustrator Artwork
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.illustrator.ai-image]
          - CFBundleTypeName: Encapsulated PostScript
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.encapsulated-postscript]
          - CFBundleTypeName: Raster Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.heic, public.tiff, com.compuserve.gif, org.webmproject.webp]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ca.hologram.vectorcraft.document
            UTTypeDescription: VectorCraft Document
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [vectorcraft]
              public.mime-type: [application/x-vectorcraft]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: ca.hologram.vectorcraft.legacy
            UTTypeDescription: DrawCraft Document
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [drawcraft]
          - UTTypeIdentifier: com.adobe.illustrator.ai-image
            UTTypeDescription: Illustrator Artwork
            UTTypeConformsTo: [public.data, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [ai]
          - UTTypeIdentifier: com.adobe.encapsulated-postscript
            UTTypeDescription: Encapsulated PostScript
            UTTypeConformsTo: [public.data, public.image]
            UTTypeTagSpecification:
              public.filename-extension: [eps]
  VectorCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VectorCraftTests
    dependencies:
      - target: VectorCraft
      - package: VectorCraftKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.vectorcraft.tests
        GENERATE_INFOPLIST_FILE: YES
  VectorCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VectorCraftUITests
    dependencies:
      - target: VectorCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.hologram.vectorcraft.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VectorCraft
schemes:
  VectorCraft:
    build:
      targets:
        VectorCraft: all
        VectorCraftTests: [test]
        VectorCraftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VectorCraftTests, VectorCraftUITests]
